
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veggie Collection</title>
    <link rel="stylesheet" href="veggie.css">
</head>
<body>
    <header>
        <h1>My Veggie Collection</h1>
        <p>Keep track of your favorite veggies!</p>
    </header>

    <main>
        <section>
            <h2>Add a Veggie</h2>

            <form id="veggieForm">
                <input type="text" id="name"
                    placeholder="Veggie name" required>
                <button type="submit">Add Veggie</button>
            </form>

            <p id="message" role="status"></p>
        </section>

        <section>
            <h2>My Veggies</h2>
            <div id="veggieList"></div>
        </section>
    </main>

    <script>
        document.getElementById("veggieForm").addEventListener("submit", function (event) {
            event.preventDefault();

            const input = document.getElementById("name");
            const veggieName = input.value.trim();
            if (!veggieName) {
                input.focus();
                return;
            }

            const veggie = document.createElement("p");
            veggie.textContent = veggieName;
            document.getElementById("veggieList").appendChild(veggie);
            document.getElementById("message").textContent = veggieName + " added!";

            input.value = "";
            input.focus();
        });
    </script>
</body>
</html>
