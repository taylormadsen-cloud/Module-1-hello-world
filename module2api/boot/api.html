<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Duck Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-warning-subtle">

    <div class="container text-center mt-5">

        <h1>🦆 Random Duck</h1>

        <p>Click the box to get a random duck!</p>

        <div class="card mx-auto p-4 shadow" style="max-width: 500px;">

            <img id="duckImage" class="img-fluid mb-3" src="https://random-d.uk/api/1.jpg">

            <button id="duckButton" class="btn btn-warning">
                Click for a New Duck!
            </button>
        </div>
    </div>
    <script src="api.js"></script>

</body>

</html>
