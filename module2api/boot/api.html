<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Random Duck Generator</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- My CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-dark bg-warning">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">🦆 Random Duck</a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container text-center mt-5">

        <div class="row justify-content-center">

            <div class="col-md-8">

                <h1 class="display-4 fw-bold">Random Duck Generator 🦆</h1>

                <p class="lead">
                    Need a random duck? Click the button below!
                </p>

                <!-- Fun Box -->
                <div class="card shadow-lg border-0 p-4 mt-4">

                    <h2 class="mb-3">Your Duck of the CLick</h2>

                    <!-- Duck Image -->
                    <div class="duck-container mb-4">
                        <img id="duckImage"
                             src="https://random-d.uk/api/1.jpg"
                             class="img-fluid rounded"
                             alt="Random duck">
                    </div>

                    <!-- Button -->
                    <button id="duckButton"
                            class="btn btn-warning btn-lg fw-bold">
                        🦆 Click for a New Duck!
                    </button>

                    <p id="message" class="mt-3 text-muted">
                        Powered by random-d.uk
                    </p>

                </div>

            </div>

        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center mt-5 py-4 bg-dark text-white">
        <p class="mb-0">Random Duck Generator | Public API Project</p>
    </footer>

    <script src="api.js"></script>

</body>

</html>
