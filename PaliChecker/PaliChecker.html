<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Palindrome Checker  </title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!---css -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Palindrome Checker</h1>
        <form id="palindromeForm">
            <div class="mb-3">
                <label for="word" class="form-label"> Enter the word:</label>
                <input type="text" id="word" class="form-control">
            </div>
            <div class="mb-3">
                <label for="algorithm" class="form-label">
                    Choose an algorithm:
                </label>
                <select id="algorithm" class="form-select">
                    <option value="">Select an algorithm</option>
                    <option value="1">Algorithm 1</option>
                    <option value="2">Algorithm 2</option>
                    <option value="3">Algorithm 3</option>
                </select>
            </div>
            <div class="form-check mb-3">
                <input type="checkbox" id="caseSensitive" class="form-check-input">
                <label for="caseSensitive" class="form-check-label">
                    Case Sensitive
                </label>
            </div>
            <buttom type="submit" class="btn btn-primary">
                Check Palindrome
            </buttom>
        </form>
        <div id="message" class="mt-3"></div>
        <div class="results">
            <div>
                <h2> Algorithm 1 Results</h2>
                <p id="algorithm1Results"></p>
            </div>
            <div>
                <h2> Algorithm 2 Results</h2>
                <p id="algorithm2Results"></p>
            </div>
            <div>
                <h2> Algorithm 3 Results</h2>
                <p id="algorithm3Results"></p>
            </div>
        </div>
    </div>
    <script src="PaliChecker.js"></script>
</body>
