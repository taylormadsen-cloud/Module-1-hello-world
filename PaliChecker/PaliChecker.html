<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Palindrome Checker</title>

    <!-- Bootstrap for styling -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Custom CSS -->
    <link rel="stylesheet" href="PaliChecker.css">

</head>

<body> <!-- Bootstrap container -->
    <div class="container py-4">
      <h1 class="text-center mb-4">Palindrome Checker</h1>

    <form id="form">
        <div class="mb-3">
            <label for="word">Enter a word:</label>
            <input type="text" id="word" class="form-control">
        </div>

        <div class="mb-3">
            <label for="algorithm">Choose an algorithm:</label>
            <select id="algorithm" class="form-select">
                <option value="">Choose one</option>
                <option value="1">Algorithm 1</option>
                <option value="2">Algorithm 2</option>
                <option value="3">Algorithm 3</option>
            </select>
        </div>

        <input type="checkbox" id="caseSensitive">
        <label for="caseSensitive">Case-sensitive</label>

        <button type="submit" class="btn btn-primary">
            Check Palindrome
        </button>
    </form>

    <!-- Keep message and results here -->
    <div id="message" class="mt-3"></div>

        <!-- Results are displayed in separate lists -->
        <div class="results mt-4">

            <!-- Algorithm 1 results -->
            <div class="result-box">

                <h2>Algorithm 1 Results</h2>

                <ul id="algorithm1Results">
                </ul>

            </div>

            <!-- Algorithm 2 results -->
            <div class="result-box">

                <h2>Algorithm 2 Results</h2>

                <ul id="algorithm2Results">
                </ul>

            </div>

            <!-- Algorithm 3 results -->
            <div class="result-box">

                <h2>Algorithm 3 Results</h2>

                <ul id="algorithm3Results">
                </ul>

            </div>

        </div>

    </div>

    <!-- JavaScript file -->
    <script src="PaliChecker.js"></script>
</body>

</html>
