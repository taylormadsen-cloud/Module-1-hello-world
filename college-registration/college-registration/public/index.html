<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>College Registration</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
      <span class="navbar-brand mb-0 h1">College Registration</span>
    </div>
  </nav>

  <main class="container pb-5">

    <!-- success / error messages appear here -->
    <div id="message"></div>

    <!-- Clicking a tab clears the message and loads that section's data -->
    <ul class="nav nav-tabs mb-3">
      <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#students-pane" onclick="clearMessage(); loadStudents()">Students</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#faculty-pane" onclick="clearMessage(); loadFaculty()">Faculty</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#courses-pane" onclick="clearMessage(); loadCourses()">Courses</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#registrations-pane" onclick="clearMessage(); loadRegistrations()">Registrations</button></li>
    </ul>

    <div class="tab-content">

      <!-- ===== STUDENTS ===== -->
      <div class="tab-pane fade show active" id="students-pane">
        <form id="student-form" class="card card-body mb-3" onsubmit="saveStudent(event)">
          <input type="hidden" id="student-id">
          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label" for="student-last">Last name *</label>
              <input class="form-control" id="student-last">
            </div>
            <div class="col-md-4">
              <label class="form-label" for="student-first">First name *</label>
              <input class="form-control" id="student-first">
            </div>
            <div class="col-md-4">
              <label class="form-label" for="student-email">Email (optional)</label>
              <input class="form-control" id="student-email" type="email">
            </div>
          </div>
          <div class="mt-3">
            <button class="btn btn-primary" id="student-save" type="submit">Add Student</button>
            <button class="btn btn-outline-secondary" type="button" onclick="clearStudentForm()">Clear</button>
          </div>
        </form>
        <table class="table table-striped bg-white">
          <thead><tr><th>ID</th><th>Last name</th><th>First name</th><th>Email</th><th></th></tr></thead>
          <tbody id="students-table"></tbody>
        </table>
      </div>

      <!-- ===== FACULTY ===== -->
      <div class="tab-pane fade" id="faculty-pane">
        <form id="faculty-form" class="card card-body mb-3" onsubmit="saveFaculty(event)">
          <input type="hidden" id="faculty-id">
          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label" for="faculty-last">Last name *</label>
              <input class="form-control" id="faculty-last">
            </div>
            <div class="col-md-4">
              <label class="form-label" for="faculty-first">First name *</label>
              <input class="form-control" id="faculty-first">
            </div>
            <div class="col-md-4">
              <label class="form-label" for="faculty-email">Email (optional)</label>
              <input class="form-control" id="faculty-email" type="email">
            </div>
          </div>
          <div class="mt-3">
            <button class="btn btn-primary" id="faculty-save" type="submit">Add Faculty</button>
            <button class="btn btn-outline-secondary" type="button" onclick="clearFacultyForm()">Clear</button>
          </div>
        </form>
        <table class="table table-striped bg-white">
          <thead><tr><th>ID</th><th>Last name</th><th>First name</th><th>Email</th><th></th></tr></thead>
          <tbody id="faculty-table"></tbody>
        </table>
      </div>

      <!-- ===== COURSES ===== -->
      <div class="tab-pane fade" id="courses-pane">
        <form id="course-form" class="card card-body mb-3" onsubmit="saveCourse(event)">
          <input type="hidden" id="course-id">
          <div class="row g-3">
            <div class="col-md-3">
              <label class="form-label" for="course-number">Course number *</label>
              <input class="form-control" id="course-number" placeholder="CMP335">
            </div>
            <div class="col-md-3">
              <label class="form-label" for="course-name">Course name</label>
              <input class="form-control" id="course-name">
            </div>
            <div class="col-md-3">
              <label class="form-label" for="course-faculty">Faculty *</label>
              <select class="form-select" id="course-faculty"></select>
            </div>
            <div class="col-md-3">
              <label class="form-label" for="course-limit">Enrollment limit</label>
              <input class="form-control" id="course-limit" type="number" min="1">
            </div>
          </div>
          <div class="mt-3">
            <button class="btn btn-primary" id="course-save" type="submit">Add Course</button>
            <button class="btn btn-outline-secondary" type="button" onclick="clearCourseForm()">Clear</button>
          </div>
        </form>
        <table class="table table-striped bg-white">
          <thead><tr><th>ID</th><th>Course #</th><th>Name</th><th>Faculty</th><th>Limit</th><th></th></tr></thead>
          <tbody id="courses-table"></tbody>
        </table>
      </div>

      <!-- ===== REGISTRATIONS (student / course) ===== -->
      <div class="tab-pane fade" id="registrations-pane">
        <form id="reg-form" class="card card-body mb-3" onsubmit="saveRegistration(event)">
          <input type="hidden" id="reg-id">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label" for="reg-student">Student *</label>
              <select class="form-select" id="reg-student"></select>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="reg-course">Course *</label>
              <select class="form-select" id="reg-course"></select>
            </div>
          </div>
          <div class="mt-3">
            <button class="btn btn-primary" id="reg-save" type="submit">Register</button>
            <button class="btn btn-outline-secondary" type="button" onclick="clearRegistrationForm()">Clear</button>
            <!-- these two use the student / course selected above -->
            <button class="btn btn-outline-primary" type="button" onclick="showRoster()">Class roster (selected course)</button>
            <button class="btn btn-outline-primary" type="button" onclick="showSchedule()">Student schedule (selected student)</button>
          </div>
        </form>

        <h2 class="h6" id="reg-detail-title"></h2>
        <table class="table bg-white">
          <tbody id="reg-detail-table"></tbody>
        </table>

        <h2 class="h6">All registrations</h2>
        <table class="table table-striped bg-white">
          <thead><tr><th>ID</th><th>Student</th><th>Course</th><th>Faculty</th><th></th></tr></thead>
          <tbody id="registrations-table"></tbody>
        </table>
      </div>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
